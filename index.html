const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
try{const k=sessionStorage.getItem("rsh-pw");if(k)unlock(k).then(show).catch(()=>{});}catch(_){}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value,btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;err.textContent="";
  try{const html=await unlock(pw);try{sessionStorage.setItem("rsh-pw",pw)}catch(_){}show(html);}
  catch(_){err.textContent="Incorrect password. Please try again.";btn.disabled=false;document.getElementById("pw").select();}
});
